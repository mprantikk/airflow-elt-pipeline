# Local stack: Postgres warehouse + Airflow (standalone: webserver, scheduler, triggerer).
# Airflow UI at http://localhost:8080 — the admin password is printed in the logs:
#   docker compose logs airflow | grep "Password for user"
services:
  warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  airflow:
    image: apache/airflow:2.10.5-python3.11
    command: standalone
    depends_on:
      warehouse:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      WAREHOUSE_DSN: postgresql://postgres:postgres@warehouse:5432/warehouse
      _PIP_ADDITIONAL_REQUIREMENTS: psycopg2-binary
    volumes:
      - ./:/opt/project
    ports: ["8080:8080"]
